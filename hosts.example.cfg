# BBnet Uptime Monitor — Example hosts file
# Copy this to hosts.cfg and replace with your network.
#
# ── FORMAT ──────────────────────────────────────────────────────────────────
#
#   page <slug> <Display Name>
#       Creates a top-level folder in the dashboard.
#       slug = short identifier used in URLs (no spaces)
#       Display Name = label shown on the tile (can have spaces)
#
#   subpage <slug> <Display Name>
#       Creates a nested folder under the current page.
#
#   include <filename>
#       Loads another file from the same directory (no file extension needed).
#       Useful for splitting large networks into one file per site.
#
#   IP  HOSTNAME  # testip
#       A monitored device. IP = address to ping. HOSTNAME = display name.
#       Hostnames cannot contain spaces — use underscores or hyphens.
#       Flags after # are optional and ignored (testip, dialup, trace are
#       accepted for Xymon compatibility but this monitor always uses ICMP).
#
#   # IP HOSTNAME ...
#       A line starting with # is a comment or disabled host — skipped entirely.
#       ## and ### are also skipped (Xymon convention for "very disabled").
#
# ── HIERARCHY ────────────────────────────────────────────────────────────────
#
#   Hosts placed before the first subpage go directly under the page.
#   Hosts placed after a subpage go under that subpage.
#   A new page directive resets the subpage context.
#
# ── EXAMPLE ──────────────────────────────────────────────────────────────────

page main-site Main_Site

# Hosts here appear directly under "Main Site" (no subpage)
192.168.1.1  Core_Router # testip
192.168.1.2  Backup_Router # testip

subpage access-points Access_Points
192.168.1.10 AP-Floor-1 # testip
192.168.1.11 AP-Floor-2 # testip
# 192.168.1.12 AP-Floor-3-offline # testip   ← disabled, not monitored

subpage switches Switches
192.168.1.100 Core-Switch # testip
192.168.1.101 Distribution-Switch # testip


page remote-site Remote_Site

subpage backhaul Backhaul
10.0.50.1 Backhaul-Master # testip
10.0.50.2 Backhaul-Slave # testip

subpage access Access_Points
10.0.50.10 Remote-AP-01 # testip
10.0.50.11 Remote-AP-02 # testip


# ── USING INCLUDE FILES ───────────────────────────────────────────────────────
#
# For large networks, split into separate files per region/site:
#
#   include site-cork
#   include site-dublin
#   include site-limerick
#
# Each included file follows the same format and can have its own
# page / subpage declarations.
